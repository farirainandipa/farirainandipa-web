[build]
  command = "npm run build"
  publish = "dist"

# Deploy previews may build while src/data/destinations.ts still has "[...]"
# placeholders (see scripts/placeholder-guard.ts). Production builds stay blocked.
[context.deploy-preview.environment]
  ALLOW_PLACEHOLDERS = "1"

# Serve the standalone Bid Pipeline dashboard (static file, outside the React SPA).
# This rule comes before the SPA catch-all so /pipeline resolves to the static
# document and is not rewritten to the app shell.
[[redirects]]
  from = "/pipeline"
  to = "/pipeline/index.html"
  status = 200

# The Packages page was retired; its venues and incentive ideas now live on
# the Destinations pages (exhibition tours moved to /services#trade-delegations).
[[redirects]]
  from = "/packages"
  to = "/destinations"
  status = 301
  force = true

[[redirects]]
  from = "/packages/"
  to = "/destinations"
  status = 301
  force = true

# SPA fallback: every other path renders the React app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (JS/CSS) can be cached forever, the filename changes on every change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public aren't hashed, so cache for a week and let clients revalidate.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# robots.txt and sitemap.xml change occasionally, keep revalidation frequent.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
