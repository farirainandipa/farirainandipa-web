[build]
  command = "npm run build"
  publish = "dist"

# Deploy previews may build while src/data/destinations.ts still has "[...]"
# placeholders (see scripts/placeholder-guard.ts). Production builds stay blocked.
[context.deploy-preview.environment]
  ALLOW_PLACEHOLDERS = "1"

# The Africa MICE Bid Pipeline moved to its own site on 2026-11-09. The
# pipeline pages have been removed from this repo and nothing links to
# /pipeline here, so no redirect for it is kept.

# Bid Workspace: the bid development app (static file, sign-in required inside the page).
# The header's "Client Login" link points here.
[[redirects]]
  from = "/bids"
  to = "/bids/index.html"
  status = 200

# The Packages page was retired; its venues and incentive ideas now live on
# the Destinations pages (exhibition tours moved to /services#trade-delegations).
[[redirects]]
  from = "/packages"
  to = "/destinations"
  status = 301
  force = true

[[redirects]]
  from = "/packages/"
  to = "/destinations"
  status = 301
  force = true

# The individual destination pages are hidden until their content is ready
# (destinationPagesLive in src/data/destinations.ts), so send them to the hub.
# Not forced, so the prerendered /destinations/index.html still serves.
# Remove this rule when the pages go live.
[[redirects]]
  from = "/destinations/*"
  to = "/destinations"
  status = 302

# SPA fallback: every other path renders the React app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (JS/CSS) can be cached forever, the filename changes on every change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public aren't hashed, so cache for a week and let clients revalidate.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# robots.txt and sitemap.xml change occasionally, keep revalidation frequent.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
