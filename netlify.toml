[build]
  command = "npm run build"
  publish = "dist"

# The Africa MICE Bid Pipeline moved to its own site on 2026-11-09.
# The public-facing client login link is now /bids; it and every other
# /pipeline URL (history, partner form and its email verification links,
# submit form) are sent there with path and query kept. The pipeline pages
# have been removed from this repo; the /pipeline redirects below only keep
# old links and already-sent emails working.
[[redirects]]
  from = "/bids"
  to = "https://africamicedashboard.netlify.app/pipeline/"
  status = 301
  force = true

[[redirects]]
  from = "/bids/*"
  to = "https://africamicedashboard.netlify.app/pipeline/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/pipeline"
  to = "https://africamicedashboard.netlify.app/pipeline/"
  status = 301
  force = true

[[redirects]]
  from = "/pipeline/*"
  to = "https://africamicedashboard.netlify.app/pipeline/:splat"
  status = 301
  force = true

# SPA fallback: every other path renders the React app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (JS/CSS) can be cached forever, the filename changes on every change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public aren't hashed, so cache for a week and let clients revalidate.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# robots.txt and sitemap.xml change occasionally, keep revalidation frequent.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
