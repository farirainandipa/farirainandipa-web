[build]
  command = "npm run build"
  publish = "dist"

# Serve the standalone Bid Pipeline dashboard (static file, outside the React SPA).
# This rule comes before the SPA catch-all so /pipeline resolves to the static
# document and is not rewritten to the app shell.
[[redirects]]
  from = "/pipeline"
  to = "/pipeline/index.html"
  status = 200

# Public bid-history teaser (no login): last three hosts per series.
[[redirects]]
  from = "/pipeline/history"
  to = "/pipeline/history.html"
  status = 200

# Destination partner submission form (no login), also the verify link and status page.
[[redirects]]
  from = "/pipeline/partner"
  to = "/pipeline/partner.html"
  status = 200

# Bid Workspace: the bid development app (static file, sign-in required inside the page).
[[redirects]]
  from = "/bids"
  to = "/bids/index.html"
  status = 200

# SPA fallback: every other path renders the React app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build output (JS/CSS) can be cached forever, the filename changes on every change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images in /public aren't hashed, so cache for a week and let clients revalidate.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# robots.txt and sitemap.xml change occasionally, keep revalidation frequent.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
